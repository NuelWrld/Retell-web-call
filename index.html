<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OutreachAI — Call Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent-dim: rgba(0,255,136,0.1);
    --accent-mid: rgba(0,255,136,0.3);
    --text: #e8e8f0;
    --muted: #555566;
    --danger: #ff4466;
    --warning: #ffaa00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,255,136,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0,100,255,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .console {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 1;
    margin: 40px 0;
  }

  .header {
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .title {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
  }

  .title span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    font-family: 'Space Mono', monospace;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .card-label {
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover {
    background: #00ffaa;
    transform: translateY(-1px);
  }

  .btn-primary:disabled {
    background: var(--muted);
    cursor: not-allowed;
    transform: none;
  }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    margin-top: 12px;
  }

  .btn-danger:hover {
    background: rgba(255,68,102,0.1);
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-idle .status-dot { background: var(--muted); }
  .status-connecting .status-dot { background: var(--warning); animation: pulse 1s infinite; }
  .status-active .status-dot { background: var(--accent); animation: pulse 1s infinite; }
  .status-ended .status-dot { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* No-token fallback state */
  .no-token-msg {
    display: none;
    text-align: center;
    padding: 40px 24px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }

  .no-token-msg .icon {
    font-size: 32px;
    margin-bottom: 16px;
  }

  .no-token-msg.visible { display: block; }

  .contact-info {
    display: none;
    background: var(--accent-dim);
    border: 1px solid var(--accent-mid);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .contact-info.visible { display: block; }

  .contact-name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .contact-detail {
    font-size: 12px;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
  }

  .waveform {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 40px;
    margin: 16px 0;
  }

  .waveform.active { display: flex; }

  .wave-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 1.2s ease-in-out infinite;
  }

  .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  .wave-bar:nth-child(6) { animation-delay: 0.3s; }
  .wave-bar:nth-child(7) { animation-delay: 0.2s; }
  .wave-bar:nth-child(8) { animation-delay: 0.1s; }
  .wave-bar:nth-child(9) { animation-delay: 0s; }

  @keyframes wave {
    0%, 100% { height: 6px; }
    50% { height: 32px; }
  }

  .transcript {
    display: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-height: 200px;
    overflow-y: auto;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .transcript.visible { display: block; }

  .transcript-line { margin-bottom: 6px; }
  .transcript-line.agent { color: var(--accent); }
  .transcript-line.user { color: var(--text); }

  .transcript-line .speaker {
    font-weight: 700;
    margin-right: 8px;
  }

  .log {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.8;
  }

  .log .entry { display: flex; gap: 8px; }
  .log .time { color: var(--accent); flex-shrink: 0; }

  @media (max-width: 600px) {
    body { padding: 14px; }
    .title { font-size: 26px; }
    .card { padding: 18px; }
    .btn { font-size: 14px; }
    .transcript { max-height: 160px; }
  }
</style>
</head>
<body>

<div class="console">
  <div class="header">
    <div class="logo">OutreachAI</div>
    <h1 class="title">Call <span>Console</span></h1>
    <p class="subtitle">// outbound agent interface</p>
  </div>

  <!-- No-token fallback -->
  <div class="no-token-msg" id="noTokenMsg">
    <div class="icon">🔗</div>
    No call token found in URL.<br>
    Open this page using the link sent to Telegram.
  </div>

  <!-- Status -->
  <div class="status-bar status-idle" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">Initializing...</span>
  </div>

  <!-- Contact Info (shown when token carries name/phone via URL params) -->
  <div class="contact-info" id="contactInfo">
    <div class="contact-name" id="contactName">—</div>
    <div class="contact-detail" id="contactDetail">—</div>
  </div>

  <!-- Waveform -->
  <div class="waveform" id="waveform">
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
    <div class="wave-bar" style="height:6px"></div>
  </div>

  <!-- Transcript -->
  <div class="transcript" id="transcript"></div>

  <!-- Buttons -->
  <button class="btn btn-primary" id="mainBtn" onclick="startCall()" style="display:none">Join Call</button>
  <button class="btn btn-danger" id="endBtn" onclick="endCall()" style="display:none">End Call</button>

  <!-- Log -->
  <div class="card" style="margin-top:16px">
    <div class="card-label">Activity Log</div>
    <div class="log" id="log">
      <div class="entry"><span class="time">[00:00]</span><span>System ready</span></div>
    </div>
  </div>
</div>

<script type="module">
  import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk';

  let retellClient = null;
  let currentToken = null;
  let callStart = null;

  function addLog(msg) {
    const log = document.getElementById('log');
    const now = new Date();
    const time = `${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `<span class="time">[${time}]</span><span>${msg}</span>`;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  function setStatus(type, text) {
    const bar = document.getElementById('statusBar');
    bar.className = `status-bar status-${type}`;
    document.getElementById('statusText').textContent = text;
  }

  async function startCall() {
    if (!currentToken) {
      addLog('ERROR: No access token available');
      return;
    }

    addLog('Initializing Retell web client...');
    setStatus('connecting', 'Connecting to call...');
    document.getElementById('mainBtn').disabled = true;

    try {
      retellClient = new RetellWebClient();

      retellClient.on('call_started', () => {
        callStart = Date.now();
        addLog('Call started — you are now speaking as the customer');
        setStatus('active', 'Call active — speak as the customer');
        document.getElementById('waveform').classList.add('active');
        document.getElementById('transcript').classList.add('visible');
        document.getElementById('mainBtn').style.display = 'none';
        document.getElementById('endBtn').style.display = 'block';
      });

      retellClient.on('call_ended', () => {
        const duration = callStart ? Math.round((Date.now() - callStart) / 1000) : 0;
        addLog(`Call ended — duration: ${duration}s`);
        setStatus('ended', `Call ended after ${duration} seconds`);
        document.getElementById('waveform').classList.remove('active');
        document.getElementById('endBtn').style.display = 'none';
        currentToken = null;
      });

      retellClient.on('agent_start_talking', () => {
        addLog('Agent speaking...');
      });

      retellClient.on('update', (update) => {
        if (update.transcript) {
          const transcript = document.getElementById('transcript');
          transcript.innerHTML = '';
          update.transcript.forEach(line => {
            const div = document.createElement('div');
            div.className = `transcript-line ${line.role === 'agent' ? 'agent' : 'user'}`;
            div.innerHTML = `<span class="speaker">${line.role === 'agent' ? 'AGENT' : 'YOU'}:</span>${line.content}`;
            transcript.appendChild(div);
          });
          transcript.scrollTop = transcript.scrollHeight;
        }
      });

      await retellClient.startCall({ accessToken: currentToken });
      addLog('Connected to Retell — waiting for agent...');

    } catch (err) {
      addLog(`ERROR: ${err.message}`);
      setStatus('idle', 'Connection failed — check token and try again');
      document.getElementById('mainBtn').disabled = false;
      document.getElementById('mainBtn').style.display = 'block';
    }
  }

  function endCall() {
    if (retellClient) {
      retellClient.stopCall();
      retellClient = null;
      addLog('Call terminated by user');
    }
  }

  // ── Boot: extract token + optional metadata from URL ──────────────────────
  window.addEventListener('load', async () => {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const name  = params.get('name');
    const phone = params.get('phone');

    if (!token) {
      document.getElementById('noTokenMsg').classList.add('visible');
      setStatus('idle', 'No token — open the Telegram link to join');
      addLog('No token found in URL');
      return;
    }

    currentToken = token;
    addLog('Access token detected from URL');

    // Show contact card if name/phone were passed as extra params
    if (name || phone) {
      document.getElementById('contactName').textContent = name || 'Unknown';
      document.getElementById('contactDetail').textContent = phone || '';
      document.getElementById('contactInfo').classList.add('visible');
    }

    setStatus('connecting', 'Token found — joining call...');
    addLog('Auto-starting call...');
    await startCall();
  });

  window.startCall = startCall;
  window.endCall = endCall;
</script>
</body>
</html>
